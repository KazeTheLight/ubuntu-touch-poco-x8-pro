name: Build klee Ubuntu Touch images

# Builds everything the klee dual-boot installer needs, split over three jobs so
# none of them hits GitHub's 6 h per-job limit:
#
#   job "kernel" -> ut_boot.img, ut_init_boot.img, ut_boot_fastboot-boot.img
#                   + the installed modules tree (artifact)
#   job "rootfs" -> ubuntu.img (EROFS)
#   job "utdata" -> ut_data.img (the ext4 image install.sh creates on the phone)
#
# Everything runs inside ubuntu:22.04 because the port's scripts need Python 2
# (make-bootimage.sh -> python2 mkdtboimg.py) and libtinfo5, neither of which
# exist on the ubuntu-22.04 runner image itself. This mirrors the upstream
# GitLab CI (port/build/gsi-port-ci.yml), which uses ubuntu:22.04 the same way.
#
# RESUMING A FAILED BUILD
# -----------------------
# The heavy state (kernel source, clang, and the kernel object tree in kout) is
# kept in the Actions cache. Re-running the workflow reuses it, so a build that
# died at minute 200 does not start again from minute 0. The cache key embeds
# BASE_COMMIT and the compiler revision, so changing either starts a clean tree
# automatically instead of mixing incompatible objects.
#
# Note on EROFS: the installer expects a compressed EROFS image made with
# `-zlz4hc,12 -E ztailpacking -C 65536`. Ubuntu 22.04 ships erofs-utils 1.4,
# which is far too old for that, so the rootfs job builds erofs-utils from source.

on:
  # Manual only: a push must not start a 30 minute kernel build.
  workflow_dispatch:
    inputs:
      build_kernel:
        description: "Build the kernel + boot images (slow, reuses the object cache)"
        type: boolean
        default: false
      kernel_run_id:
        description: "Run ID to take klee-modules / klee-boot-images from. Empty = this run."
        type: string
        default: "39363143096"
      build_rootfs:
        description: "Build ubuntu.img (EROFS rootfs)"
        type: boolean
        default: true
      rootfs_run_id:
        description: "Run ID to take klee-rootfs from when build_rootfs is off. Empty = this run."
        type: string
        default: ""
      build_utdata:
        description: "Build ut_data.img (needed for a Windows install)"
        type: boolean
        default: true
      use_cache:
        description: "Reuse the cached kernel source / toolchain / object tree"
        type: boolean
        default: true
      ut_data_mib:
        description: "Size of ut_data.img in MiB (from the phone's lpdump; 3368 for this device)"
        type: string
        default: "3368"
      kernel_jobs:
        description: "Parallel make jobs for the kernel build"
        type: string
        default: "4"

permissions:
  contents: read
  # needed to download artifacts from an earlier run (kernel_run_id)
  actions: read

# ubuntu:22.04 ships without bash, and GitHub Actions then runs steps with `sh`
# (dash), where `set -o pipefail` is fatal. Every job installs bash in its first
# step; all later steps use it.
defaults:
  run:
    shell: bash

env:
  # NOTE: build-klee.sh hardcodes "$HOME/klee-ut/...", and in a GitHub Actions
  # container HOME is /github/home (not /root). Every path here is therefore
  # derived from $HOME at run time rather than pinned to an absolute path.
  BASE_ROOTFS_URL: "https://ci.ubports.com/job/ubuntu-touch-rootfs/job/ubports%252F24.04-1.x/lastSuccessfulBuild/artifact/ubuntu-touch-android9plus-rootfs-arm64.tar.gz"
  # Pinned so the cache key changes when the compiler does.
  CLANG_REV: "r510928"
  # GitHub runners have no working IPv6 route. Force git to IPv4 too, not just
  # apt, or the clones fail the same way apt did.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: "http.version"
  GIT_CONFIG_VALUE_0: "HTTP/1.1"

jobs:
  kernel:
    name: Kernel + boot images
    # Skipped on purpose when retrying only the rootfs / ut_data jobs: those
    # pull the kernel artifacts from `kernel_run_id` instead of rebuilding.
    if: ${{ inputs.build_kernel }}
    runs-on: ubuntu-22.04
    container: ubuntu:22.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ubuntu:22.04 has no bash, so GitHub Actions falls back to `sh` (dash),
      # where `set -o pipefail` is a fatal error. This first step must therefore
      # run under plain sh; bash is installed for every step after it.
      - name: Install build dependencies
        shell: sh
        run: |
          set -ex
          # GitHub runners have no working IPv6 route; apt would otherwise burn
          # its attempts on AAAA records and fail with "Network is unreachable".
          printf 'Acquire::ForceIPv4 "true";\nAcquire::Retries "5";\n' > /etc/apt/apt.conf.d/99-ci-network
          apt-get update
          apt-get install -y --no-install-recommends \
            bash bc bison build-essential ca-certificates cpio curl \
            fakeroot flex git kmod libelf-dev libssl-dev libtinfo5 \
            lz4 pahole dwarves python2 python3 sudo unzip wget xz-utils libbpf-dev
          ln -sf /usr/bin/python2 /usr/bin/python
          rm -rf /var/lib/apt/lists/*
          python --version
          df -h /
          # Kernel 6.6 needs pahole >= 1.24 to read its BTF. Run 4 died with
          #   libbpf: BTF header not found
          #   FAILED: load BTF from vmlinux: Invalid argument
          # because the resolved pahole was 1.22. jammy-updates now carries
          # 1.25; fail loudly here instead of 20 minutes into the build if a
          # future image pins an older one back.
          PAHOLE_VER="$(pahole --version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+' | head -n1)"
          echo "pahole version: ${PAHOLE_VER:-unknown}"
          awk -v v="${PAHOLE_VER:-0}" 'BEGIN { if (v+0 < 1.24) { print "pahole too old for kernel 6.6 BTF (need >= 1.24)"; exit 1 } }'
          pahole --version

      - name: Compute cache keys
        id: keys
        run: |
          set -euxo pipefail
          BASE="$(cut -d' ' -f1 kernel/BASE_COMMIT)"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          # The kernel source and the compiler only depend on the pinned commit
          # and the compiler revision, so they are stable across runs.
          echo "src=klee-src-$BASE-${{ env.CLANG_REV }}" >> "$GITHUB_OUTPUT"
          # The object tree additionally depends on the config and the patch, so
          # a config change invalidates it instead of mixing objects.
          CFG="$(sha256sum kernel/klee-kernel.patch port/klee.config | sha256sum | cut -c1-16)"
          echo "kout=klee-kout-$BASE-${{ env.CLANG_REV }}-$CFG" >> "$GITHUB_OUTPUT"

      # Kernel source tree: ~1.5 GB. Without this the clone costs a few minutes
      # and 1.5 GB of traffic on every single run.
      - name: Restore kernel source cache
        if: ${{ inputs.use_cache }}
        id: c-src
        uses: actions/cache/restore@v4
        with:
          path: |
            /github/home/klee-ut/kernel
            /github/home/klee-ut/toolchain
          key: ${{ steps.keys.outputs.src }}

      - name: Clone the kernel and apply the klee patch
        if: ${{ steps.c-src.outputs.cache-hit != 'true' }}
        run: |
          set -euxo pipefail
          BASE="${{ steps.keys.outputs.base }}"
          rm -rf "$HOME/klee-ut/kernel"
          git clone --depth 1 -b android15-6.6-halium \
            https://gitlab.com/ubports/porting/community-ports/android12/generic/kernel-android-common.git \
            "$HOME/klee-ut/kernel"
          cd "$HOME/klee-ut/kernel"
          git fetch --depth 1 origin "$BASE"
          git checkout "$BASE"
          git apply "$GITHUB_WORKSPACE/kernel/klee-kernel.patch"
          echo "kernel tree ready at commit $BASE"

      - name: Fetch AOSP clang ${{ env.CLANG_REV }}
        if: ${{ steps.c-src.outputs.cache-hit != 'true' }}
        run: |
          set -euxo pipefail
          # setup_repositories.sh maps halium 15/16 to branch main-kernel-build-2024,
          # whose clang is r510928 - the same compiler as the stock kernel.
          # build-klee.sh wants it at $HOME/klee-ut/toolchain/clang-r510928/bin.
          rm -rf "$HOME/klee-ut/toolchain-clone"
          git clone --depth 1 -b main-kernel-build-2024 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            "$HOME/klee-ut/toolchain-clone"
          mkdir -p "$HOME/klee-ut/toolchain"
          rm -rf "$HOME/klee-ut/toolchain/clang-${{ env.CLANG_REV }}"
          mv "$HOME/klee-ut/toolchain-clone/clang-${{ env.CLANG_REV }}" "$HOME/klee-ut/toolchain/"
          rm -rf "$HOME/klee-ut/toolchain-clone"
          "$HOME/klee-ut/toolchain/clang-${{ env.CLANG_REV }}/bin/clang" --version | head -n1

      - name: Save kernel source cache
        if: ${{ inputs.use_cache && steps.c-src.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            /github/home/klee-ut/kernel
            /github/home/klee-ut/toolchain
          key: ${{ steps.keys.outputs.src }}

      - name: Prepare the port tree
        run: |
          set -euxo pipefail
          rm -rf "$HOME/klee-ut/ubports-klee"
          cp -r "$GITHUB_WORKSPACE/port" "$HOME/klee-ut/ubports-klee"
          cd "$HOME/klee-ut/ubports-klee"
          # build-klee.sh expects its own downloads dir and an OUT dir.
          mkdir -p workdir/downloads release/images
          df -h "$HOME"

      # The kernel object tree is the expensive part (~20-30 min, ~4 GB). If a
      # previous run compiled objects before dying, restoring kout means make
      # only rebuilds what actually failed.
      - name: Restore kernel object cache
        if: ${{ inputs.use_cache }}
        id: c-kout
        uses: actions/cache/restore@v4
        with:
          path: /github/home/klee-ut/kout
          key: ${{ steps.keys.outputs.kout }}

      # BTF is only needed for eBPF tracing. It is not required to boot Ubuntu
      # Touch/Display/Networking/Drivers on this device. The BTF generation via
      # pahole fails on this kernel tree (link-vmlinux.sh calls pahole directly)
      # with the combination of LTO + CFI + pahole 1.25, so just disable it
      # outright to save time and avoid hitting the broken path.
      - name: Force BTF off (skip eBPF debug info)
        run: |
          set -euxo pipefail
          cd "$HOME/klee-ut/ubports-klee"
          # klee.config is merged last by build-klee.sh so these override anything
          printf 'CONFIG_DEBUG_INFO_BTF=n\nCONFIG_DEBUG_INFO_BTF_MODULES=n\n' >> klee.config
          grep -n "DEBUG_INFO_BTF" klee.config || true
          # if a cached kout exists, force make to see the config change
          rm -f "$HOME/klee-ut/kout/.config.old" || true

      - name: Build kernel and boot images
        run: |
          set -euxo pipefail
          cd "$HOME/klee-ut/ubports-klee"
          # Pin the parallelism so a 4 vCPU runner does not swap itself to death.
          sed -i "s/-j\"\$(nproc)\"/-j${{ inputs.kernel_jobs }}/" build-klee.sh
          SKIP_ROOTFS=1 ./build-klee.sh

      - name: Collect the build outputs
        run: |
          set -euxo pipefail
          KREL="$(cat "$HOME/klee-ut/kout/include/config/kernel.release")"
          echo "KREL=$KREL" >> "$GITHUB_ENV"
          echo "kernel release: $KREL"
          # build-klee.sh writes to "$HOME/poco x8 pro ub touch/release/images";
          # copy the results somewhere upload-artifact can find without $HOME.
          mkdir -p "$GITHUB_WORKSPACE/out/boot"
          cp "$HOME/poco x8 pro ub touch/release/images/ut_boot.img" \
             "$HOME/poco x8 pro ub touch/release/images/ut_init_boot.img" \
             "$HOME/poco x8 pro ub touch/release/images/ut_boot_fastboot-boot.img" \
             "$GITHUB_WORKSPACE/out/boot/"
          # UT-owned vendor_boot (small, no Android userspace). Optional so an
          # older tree that lacks vendor-ramdisk-overlay still builds.
          if [ -f "$HOME/poco x8 pro ub touch/release/images/ut_vendor_boot.img" ]; then
            cp "$HOME/poco x8 pro ub touch/release/images/ut_vendor_boot.img" "$GITHUB_WORKSPACE/out/boot/"
          fi
          # and the installed modules, needed by the rootfs + utdata jobs
          mkdir -p "$GITHUB_WORKSPACE/out/modules"
          cp -a "$HOME/klee-ut/work/modroot/lib/modules/." "$GITHUB_WORKSPACE/out/modules/"
          ls -la "$GITHUB_WORKSPACE/out/boot"
          du -sh "$GITHUB_WORKSPACE/out/modules"

      - name: Report which configuration produced the images
        run: |
          set -euxo pipefail
          if grep -qE '^(# )?CONFIG_DEBUG_INFO_BTF=y' "$HOME/klee-ut/kout/.config"; then
            echo "::notice::built WITH BTF"
          else
            echo "::notice::built WITHOUT BTF (eBPF tracing unavailable; not required for boot)"
          fi

      # Save the object tree only after a successful build, so a failed run
      # never poisons the cache with a half-written tree.
      - name: Save kernel object cache
        if: ${{ inputs.use_cache && success() }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: /github/home/klee-ut/kout
          key: ${{ steps.keys.outputs.kout }}

      - name: Check module count
        run: |
          set -euxo pipefail
          find "$GITHUB_WORKSPACE/out/modules" -name '*.ko' | wc -l

      - name: Upload boot images
        uses: actions/upload-artifact@v4
        with:
          name: klee-boot-images
          path: |
            out/boot/ut_boot.img
            out/boot/ut_init_boot.img
            out/boot/ut_boot_fastboot-boot.img
            out/boot/ut_vendor_boot.img
          if-no-files-found: error
          retention-days: 14

      - name: Upload installed modules
        uses: actions/upload-artifact@v4
        with:
          name: klee-modules
          path: out/modules/
          if-no-files-found: error
          retention-days: 14

  rootfs:
    name: Ubuntu Touch rootfs (ubuntu.img)
    needs: kernel
    # always(): the kernel job is deliberately skipped on a retry, and without
    # it GitHub would skip this job too.
    if: ${{ always() && inputs.build_rootfs && (needs.kernel.result == 'success' || needs.kernel.result == 'skipped') }}
    runs-on: ubuntu-22.04
    container: ubuntu:22.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        shell: sh
        run: |
          set -ex
          # See the kernel job: no bash in ubuntu:22.04, and no IPv6 route.
          printf 'Acquire::ForceIPv4 "true";\nAcquire::Retries "5";\n' > /etc/apt/apt.conf.d/99-ci-network
          apt-get update
          apt-get install -y --no-install-recommends \
            autoconf automake bash build-essential ca-certificates cmake curl \
            e2fsprogs git kmod liblz4-dev libselinux1-dev libtool libtool-bin \
            pkg-config python3 sudo uuid-dev xz-utils zlib1g-dev
          rm -rf /var/lib/apt/lists/*
          df -h /
          # erofs-utils' ./autogen.sh needs these; missing aclocal failed with
          #   ./autogen.sh: 4: aclocal: not found
          # and a missing make made ./configure die with
          #   config.status: error: Something went wrong bootstrapping makefile
          # python3 is required by port/rootfs-patches/lomiri-klee.sh.
          command -v aclocal autoheader autoreconf libtoolize make gcc python3

      # Ubuntu 22.04's erofs-utils is 1.4; -E ztailpacking needs >= 1.6 and the
      # 64K pcluster size (-C 65536) needs >= 1.5. Build 1.7.1 ourselves.
      # Use the GitHub mirror: git.infradead.org is behind bot protection.
      - name: Build erofs-utils from source
        run: |
          set -euxo pipefail
          git clone --depth 1 -b v1.7.1 https://github.com/erofs/erofs-utils.git /tmp/erofs
          cd /tmp/erofs
          ./autogen.sh
          ./configure --prefix=/usr --enable-lz4
          make -j"$(nproc)"
          make install
          # `mkfs.erofs --version` does not exist in 1.7.1: it prints its usage
          # and exits 1, which killed this step *after* a successful build. Assert
          # the options the image actually needs instead.
          #   -C#   physical cluster size (-C 65536)        needs >= 1.5
          #   lz4hc compressor (-zlz4hc,12)                  enabled above
          #   -E ztailpacking                                needs >= 1.6
          mkfs.erofs --help > /tmp/erofs-help.txt 2>&1 || true
          head -n 3 /tmp/erofs-help.txt
          grep -q -- '-C#' /tmp/erofs-help.txt \
            || { echo "mkfs.erofs has no -C option, too old (need >= 1.5)"; exit 1; }
          grep -q 'lz4hc' /tmp/erofs-help.txt \
            || { echo "mkfs.erofs was built without the lz4hc compressor"; exit 1; }
          echo "mkfs.erofs is usable"

      - name: Download the kernel modules artifact (this run)
        if: ${{ inputs.kernel_run_id == '' || inputs.build_kernel }}
        uses: actions/download-artifact@v4
        with:
          name: klee-modules
          path: /tmp/klee-modules

      # A retry takes the modules from the run that already built the kernel,
      # so the expensive build does not have to happen again.
      - name: Download the kernel modules artifact (run ${{ inputs.kernel_run_id }})
        if: ${{ inputs.kernel_run_id != '' && !inputs.build_kernel }}
        uses: actions/download-artifact@v4
        with:
          name: klee-modules
          path: /tmp/klee-modules
          run-id: ${{ inputs.kernel_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch the UT 24.04-1.x base rootfs
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/klee-ut/downloads/out"
          curl -4 -L --fail --retry 3 -o "$HOME/klee-ut/downloads/out/rootfs.tar.gz" "$BASE_ROOTFS_URL"
          ls -la "$HOME/klee-ut/downloads/out"

      - name: Assemble the rootfs image
        run: |
          set -euxo pipefail
          # KREL is the single entry in the modules artifact; recover it and
          # sanity-check that exactly one module tree was uploaded.
          KREL="$(find /tmp/klee-modules -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | head -n1)"
          test -n "$KREL"
          echo "KREL=$KREL" >> "$GITHUB_ENV"
          echo "modules for kernel release: $KREL"

          PORT="$GITHUB_WORKSPACE/port"
          WORK="$HOME/klee-ut/work"
          # Build the tree in a plain directory and point mkfs.erofs straight at
          # it. The earlier version created an ext4 image and loop-mounted it,
          # which needs privileges a job container does not reliably have.
          MNT="$WORK/system"
          rm -rf "$WORK/base" "$MNT"
          mkdir -p "$MNT"
          cd "$PORT"

          # 1. Unpack the base rootfs. The tarball puts everything under one
          # top-level directory, so strip it instead of assuming the name
          # ("system"). Everything after this point needs $MNT to be a real
          # directory: when it was a symlink, `ln -s ... $MNT/lib` failed with
          # ENOENT and the step died before the modules were copied.
          tar xzf "$HOME/klee-ut/downloads/out/rootfs.tar.gz" -C "$MNT" \
            --strip-components=1 --numeric-owner
          echo "--- top of the unpacked rootfs ---"
          ls -la "$MNT" | head -n 25
          if [ ! -d "$MNT/usr" ] || [ ! -d "$MNT/etc" ]; then
            echo "!! unexpected rootfs layout: no usr/ and etc/ at the top"
            find "$MNT" -maxdepth 2 | head -n 40
            exit 1
          fi

          # 2. Replace the generic GKI modules with the klee ones.
          # The base rootfs ships no module tree at all, so it has to be created.
          # depmod -b looks in $MNT/lib/modules, which is $MNT/usr/lib/modules
          # on a usrmerge system.
          if [ -L "$MNT/lib" ] || [ -d "$MNT/usr/lib" ]; then
            MODDIR="$MNT/usr/lib/modules"
            if [ ! -e "$MNT/lib" ] && [ ! -L "$MNT/lib" ]; then
              ln -s usr/lib "$MNT/lib"
            fi
          else
            MODDIR="$MNT/lib/modules"
          fi
          mkdir -p "$MODDIR"
          rm -rf "$MODDIR"/*
          cp -a "/tmp/klee-modules/$KREL" "$MODDIR/"
          chown -R root:root "$MODDIR"
          depmod -b "$MNT" "$KREL"
          echo "modules installed into $MODDIR/$KREL"

          # 3. klee device overlay + rootfs patches (same order as build-klee.sh).
          rm -rf "$MODDIR"/*/build "$MODDIR"/*/source
          cp -a --no-preserve=ownership "$PORT/overlay/system/." "$MNT/"
          # chown -R aborts the step under set -e if a path is absent
          for d in "$MNT/usr/libexec/lxc-android-config" "$MNT/etc/deviceinfo"; do
            [ -e "$d" ] || { echo "note: $d does not exist, skipped chown"; continue; }
            chown -R root:root "$d"
          done
          # glob only if it matches something, otherwise chown fails on the literal
          if compgen -G "$MNT/usr/bin/klee-*" >/dev/null; then
            chown -R root:root "$MNT/usr/bin/klee-"*
          fi
          for p in "$PORT"/rootfs-patches/*.sh; do
            echo "applying rootfs patch: $p"
            bash "$p" "$MNT"
          done
          echo "klee $(date -u +%Y%m%d-%H%M)" > "$MNT/etc/klee-port-version"

          # 4. Ship the rootfs as compressed EROFS so it fits, with user data,
          #    into the free space in super.
          OUT="$GITHUB_WORKSPACE/release/images"
          mkdir -p "$OUT"
          rm -f "$WORK/ubuntu.erofs" "$OUT/ubuntu.img"
          mkfs.erofs -zlz4hc,12 -E ztailpacking -C 65536 "$WORK/ubuntu.erofs" "$MNT"
          mv "$WORK/ubuntu.erofs" "$OUT/ubuntu.img"
          ls -la "$OUT/ubuntu.img"

      - name: Upload rootfs image
        uses: actions/upload-artifact@v4
        with:
          name: klee-rootfs
          path: release/images/ubuntu.img
          if-no-files-found: error
          retention-days: 14

  # install.sh builds ut_data.img on Linux with debugfs/img2simg, which do not
  # exist on Windows. Produce it here instead, so a Windows machine only needs
  # adb + fastboot (both already in platform-tools) to install.
  utdata:
    name: ut_data.img for the Windows installer
    # It needs ubuntu.img from rootfs AND the boot images from kernel, so both
    # must finish first. With only `needs: kernel` this job could start before
    # rootfs uploaded klee-rootfs and the download would fail.
    needs: [kernel, rootfs]
    # rootfs must have produced ubuntu.img, but on a retry it may be skipped and
    # ubuntu.img taken from an earlier run (rootfs_run_id) instead - the same
    # arrangement the kernel job already allows.
    if: ${{ always() && inputs.build_utdata && ((inputs.build_rootfs && needs.rootfs.result == 'success') || (!inputs.build_rootfs && inputs.rootfs_run_id != '')) }}
    runs-on: ubuntu-22.04
    container: ubuntu:22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        shell: sh
        run: |
          set -ex
          printf 'Acquire::ForceIPv4 "true";\nAcquire::Retries "5";\n' > /etc/apt/apt.conf.d/99-ci-network
          apt-get update
          apt-get install -y --no-install-recommends \
            android-sdk-libsparse-utils bash ca-certificates curl e2fsprogs git \
            python3 sudo unzip wget xz-utils
          rm -rf /var/lib/apt/lists/*
          command -v img2simg
          command -v mkfs.ext4
          command -v debugfs

      - name: Download the rootfs image (this run)
        if: ${{ inputs.build_rootfs }}
        uses: actions/download-artifact@v4
        with:
          name: klee-rootfs
          path: release/images

      - name: Download the rootfs image (run ${{ inputs.rootfs_run_id }})
        if: ${{ !inputs.build_rootfs }}
        uses: actions/download-artifact@v4
        with:
          name: klee-rootfs
          path: release/images
          run-id: ${{ inputs.rootfs_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download the boot images (this run)
        if: ${{ inputs.kernel_run_id == '' || inputs.build_kernel }}
        uses: actions/download-artifact@v4
        with:
          name: klee-boot-images
          path: release/images

      - name: Download the boot images (run ${{ inputs.kernel_run_id }})
        if: ${{ inputs.kernel_run_id != '' && !inputs.build_kernel }}
        uses: actions/download-artifact@v4
        with:
          name: klee-boot-images
          path: release/images
          run-id: ${{ inputs.kernel_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The real install.sh cannot run here: it drives adb/fastboot at a phone
      # that does not exist, and it wants a live super partition to size ut_data
      # from. This reproduces only its image-building half (steps 2b-4), with the
      # ut_data size passed in from the phone's own lpdump (3368 MiB), and stops
      # at the dry-run exit, exactly like `install.sh --dry-run`.
      - name: Build ut_data.img
        run: |
          set -euxo pipefail
          HERE="$GITHUB_WORKSPACE/release"
          IMG="$HERE/images"
          WORK="$HERE/work"
          UT_MIB="${{ inputs.ut_data_mib }}"

          for f in ut_boot.img ut_init_boot.img ubuntu.img; do
            test -f "$IMG/$f" || { echo "missing $IMG/$f"; exit 1; }
          done

          mkdir -p "$WORK"
          RAW="$WORK/ut_data.raw"
          rm -f "$RAW" "$WORK/ut_data.img"
          truncate -s "${UT_MIB}M" "$RAW"
          # Halium's initramfs ships e2fsck 1.43: keep the feature set it knows.
          # Asking for a feature this mke2fs does not know makes it reject the
          # ENTIRE option set ("Invalid filesystem option set"), so probe each
          # one with a dry run first. ubuntu:22.04 has e2fsprogs 1.46.5, which
          # predates orphan_file; some runners have a newer one that needs it
          # switched off.
          FSOPT=""
          for f in metadata_csum metadata_csum_seed orphan_file; do
            if mkfs.ext4 -q -F -n -O "^$f" "$RAW" >/dev/null 2>&1; then
              FSOPT="${FSOPT:+$FSOPT,}^$f"
            else
              echo "note: this e2fsprogs has no $f feature, leaving it alone"
            fi
          done
          echo "ext4 feature options: ${FSOPT:-<none>}"
          if [ -n "$FSOPT" ]; then
            mkfs.ext4 -q -F -L ut_data -b 4096 -m 0 -O "$FSOPT" "$RAW"
          else
            mkfs.ext4 -q -F -L ut_data -b 4096 -m 0 "$RAW"
          fi

          # debugfs cannot cope with spaces in paths; use a symlink farm.
          L="$(mktemp -d /tmp/klee-ut.XXXXXX)"
          ln -s "$IMG/ubuntu.img"            "$L/ubuntu.img"
          ln -s "$IMG/ut_boot.img"           "$L/ut_boot.img"
          ln -s "$IMG/ut_init_boot.img"      "$L/ut_init_boot.img"

          # install.sh also writes the phone's own android boot backups here.
          # Those are device-specific, so they are NOT baked in: the Windows
          # installer writes them after taking its own backup. ut_data.img here
          # therefore contains the rootfs and the UT boot images only.
          {
            echo "write $L/ubuntu.img ubuntu.img"
            echo "mkdir klee-dualboot"
            for f in ut_boot.img ut_init_boot.img; do
              echo "write $L/$f klee-dualboot/$f"
            done
          } | debugfs -w -f - "$RAW" >/dev/null
          rm -f "$L"/*; rmdir "$L"

          for f in ubuntu.img klee-dualboot/ut_boot.img klee-dualboot/ut_init_boot.img; do
            debugfs -R "stat $f" "$RAW" 2>/dev/null | grep -q 'Type: regular' \
              || { echo "failed to write $f into ut_data"; exit 1; }
          done
          e2fsck -fn "$RAW" >/dev/null || { echo "ut_data image check failed"; exit 1; }
          img2simg "$RAW" "$WORK/ut_data.img"
          rm -f "$RAW"
          ls -la "$WORK/ut_data.img"
          mkdir -p "$HERE/images"
          cp "$WORK/ut_data.img" "$HERE/images/ut_data.img"

      - name: Upload ut_data image
        uses: actions/upload-artifact@v4
        with:
          name: klee-utdata
          path: release/images/ut_data.img
          if-no-files-found: error
          retention-days: 14
